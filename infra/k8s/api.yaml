apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "8000" }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      initContainers:
        - name: migrate
          image: algodesk/api
          command: ["alembic", "upgrade", "head"]
          envFrom: [{ configMapRef: { name: algodesk-config } }, { secretRef: { name: algodesk-secrets } }]
      containers:
        - name: api
          image: algodesk/api
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: algodesk-config } }, { secretRef: { name: algodesk-secrets } }]
          env: [{ name: OTEL_SERVICE_NAME, value: algo-api }]
          readinessProbe: { httpGet: { path: /api/health, port: 8000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health, port: 8000 }, periodSeconds: 20, failureThreshold: 5 }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
