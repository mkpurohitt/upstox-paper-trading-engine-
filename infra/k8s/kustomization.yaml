# k8s-ready manifests (EKS ap-south-1 recommended for DPDP data residency).
# kubectl apply -k infra/k8s   (after creating the `algodesk-secrets` secret)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: algodesk
resources:
  - namespace.yaml
  - configmap.yaml
  - api.yaml
  - workers.yaml
  - web.yaml
  - ingress.yaml
images:
  - name: algodesk/api
    newTag: latest
  - name: algodesk/web
    newTag: latest
