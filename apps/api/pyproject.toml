[project]
name = "algo-api"
version = "0.1.0"
description = "FastAPI gateway: REST, WebSocket, auth, orchestration"
requires-python = ">=3.12"
dependencies = [
  "algo-common",
  "algo-db",
  "algo-market-data",
  "algo-broker-gateway",
  "algo-strategy-engine",
  "algo-ai-agent",
  "algo-jobs",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "alembic>=1.14",
  "pyjwt>=2.10",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "arq>=0.26",
  "sentry-sdk>=2.19",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "python-multipart>=0.0.18",
  "email-validator>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
