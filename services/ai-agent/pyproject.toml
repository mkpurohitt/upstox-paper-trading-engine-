[project]
name = "algo-ai-agent"
version = "0.1.0"
description = "LLM gateway, RAG pipeline, tool-using agent, guardrails and evals"
requires-python = ">=3.12"
dependencies = [
  "algo-common",
  "algo-db",
  "algo-market-data",
  "algo-broker-gateway",
  "algo-strategy-engine",
  "openai>=1.57",
  "anthropic>=0.40",
  "mcp>=1.6",
  "pypdf>=5.1",
  "beautifulsoup4>=4.12",
  "feedparser>=6.0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_agent"]
