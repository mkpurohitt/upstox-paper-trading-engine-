[project]
name = "algo-jobs"
version = "0.1.0"
description = "Background job queue (arq) - backtests, scanners, ingestion, RAG indexing, news, alerts"
requires-python = ">=3.12"
dependencies = [
  "algo-common",
  "algo-db",
  "algo-market-data",
  "algo-broker-gateway",
  "algo-strategy-engine",
  "algo-ai-agent",
  "arq>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["algo_jobs"]
