[project]
name = "algo-market-data"
version = "0.1.0"
description = "Market data providers (Upstox, NSE MCP, Mock), ingestion and live tick fan-out"
requires-python = ">=3.12"
dependencies = [
  "algo-common",
  "algo-db",
  "httpx>=0.28",
  "websockets>=13.1",
  "protobuf>=5.28",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "mcp>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["market_data"]
