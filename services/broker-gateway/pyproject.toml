[project]
name = "algo-broker-gateway"
version = "0.1.0"
description = "Unified broker adapters (10 Indian brokers + paper), symbol mapping, risk engine and order router"
requires-python = ">=3.12"
dependencies = [
  "algo-common",
  "algo-db",
  "algo-market-data",
  "httpx>=0.28",
  "pyotp>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["broker_gateway"]
