[project]
name = "algo-common"
version = "0.1.0"
description = "Shared settings, schemas, messaging bus, crypto vault and utilities"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "redis>=5.2",
  "cryptography>=43",
  "httpx>=0.28",
  "prometheus-client>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["algo_common"]
