[project]
name = "algo-db"
version = "0.1.0"
description = "SQLAlchemy 2 models, async session management and audit helpers"
requires-python = ">=3.12"
dependencies = [
  "algo-common",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "aiosqlite>=0.20",
  "pgvector>=0.3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["algo_db"]
