# Hot-reload overrides used by `make dev`.
services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload",
              "--reload-dir", "/app/apps/api", "--reload-dir", "/app/services", "--reload-dir", "/app/packages"]
    volumes:
      - ./apps/api/app:/app/apps/api/app
      - ./services:/app/services
      - ./packages/py-common:/app/packages/py-common
      - ./packages/db:/app/packages/db
    environment:
      LOG_JSON: "false"
